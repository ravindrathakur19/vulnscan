# Run Prometheus bound to the K3s node's private interface only, e.g.:
#   docker run -d --name prometheus -p 127.0.0.1:9090:9090 \
#     -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml \
#     prom/prometheus
# Then reach it via `ssh -L 9090:localhost:9090 ubuntu@<ec2-ip>` - never bind
# 0.0.0.0:9090 on a security group that allows 0.0.0.0/0 inbound.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "vulnscan-app"
    # app.py starts this on METRICS_PORT (default 9200), separate from the
    # public app port, specifically so /metrics is never internet-facing.
    # "scanner-service" is the Kubernetes Service name (k8s/scanner-service.yaml);
    # change this to the container's own address if running outside K8s.
    static_configs:
      - targets: ["scanner-service:9200"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
