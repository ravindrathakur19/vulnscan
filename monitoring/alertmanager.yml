# Replace the webhook/email receiver with your own before relying on this.
# Keep Alertmanager on the private network too (see prometheus.yml note).
global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "default"
    # Example: email via a free SMTP relay, or a webhook to Slack/Discord.
    # email_configs:
    #   - to: "you@example.com"
    #     from: "alertmanager@vulnscan.local"
    #     smarthost: "smtp.example.com:587"
    #     auth_username: "alertmanager@vulnscan.local"
    #     auth_password: "REPLACE_ME"   # use a Docker/K8s secret, never commit this
    webhook_configs: []
